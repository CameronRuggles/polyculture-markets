# cargo-deny configuration for seller-helper (standalone crate, not a
# member of the marketplace workspace — it builds and audits on its own).
# Same policy as marketplace/deny.toml, trimmed to the licences actually
# present in this crate's locked tree on 2026-10-17 (all permissive;
# the crate itself is AGPL-3.0-or-later). See
# DETERMINISTIC-TOOLS-REPORT-2026-10-17.md.

[advisories]
ignore = []

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
