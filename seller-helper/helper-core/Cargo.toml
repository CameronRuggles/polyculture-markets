[package]
name = "helper-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hidden Trades helper core (Alpha spec §14): canonical statement handling, buyer verify, the trade fold, the evidence store, and transaction-proof construction — shared by the helper's seller and buyer modes."

[dependencies]
domain = { path = "../../marketplace/crates/domain" }
modules-api = { path = "../../marketplace/crates/modules-api" }
sequoia-openpgp = { version = "2.4.1", features = ["compression"] }
sha2 = "0.10"
sha3 = "0.10"
monero = "0.22"
curve25519-dalek = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
rand = "0.8"
anyhow = "1"
