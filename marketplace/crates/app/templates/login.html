<h1>Log in</h1>
{% if let Some(e) = error %}<p role="alert">{{ e }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username <input name="username" required></label>
<label>Passphrase <input type="password" name="password" required></label>
<label>TOTP code (required if you have two-factor authentication on) <input name="totp" inputmode="numeric" autocomplete="one-time-code"></label>
<button type="submit">Log in</button></form>
