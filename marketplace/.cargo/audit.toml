# cargo-audit configuration for the marketplace workspace.
#
# cargo-audit scans the raw Cargo.lock, which includes optional
# dependencies that are never compiled. RUSTSEC-2023-0071 (rsa 0.9.10,
# "Marvin Attack" timing side-channel, severity 5.9 medium, no fixed
# release available) matches only because sqlx's Cargo.lock entry lists
# its optional MySQL backend (sqlx-mysql -> rsa). This project builds
# sqlx with the postgres backend only:
#   * `cargo tree` contains no rsa and no sqlx-mysql;
#   * no rsa artefact exists under target/;
#   * cargo-deny's feature-resolved advisory check does not detect it.
# The Marvin attack additionally requires RSA private-key decryption
# operations; this codebase performs none. Accepted 2026-10-17 as part
# of the deterministic-tools pass — see
# DETERMINISTIC-TOOLS-REPORT-2026-10-17.md in the parent directory.
# If the sqlx MySQL backend is ever enabled, this ignore must be
# removed and the exposure re-assessed.
#
# RUSTSEC-2026-0459 (libsqlite3-sys 0.30.1, CVE-2026-119375,
# "SQLite <3.54.0 WAL-reset database-content disclosure", severity
# 6.8 medium) is the identical lockfile-only pattern through a
# different optional sqlx backend: the lockfile entry exists only
# because sqlx's optional SQLite backend (sqlx-sqlite) depends on
# libsqlite3-sys. This project builds sqlx with the postgres
# backend only (features = ["runtime-tokio", "postgres", "time"]
# in crates/app and tests/security):
#   * `cargo tree` contains no libsqlite3-sys and no sqlx-sqlite;
#   * `cargo tree -i libsqlite3-sys` prints nothing;
#   * no SQLite artefact is compiled or linked.
# The advisory additionally requires an application that opens
# SQLite databases through the bundled library; this codebase
# opens none. Verified 2026-11-17, after the scheduled CI run of
# 2026-11-16 (43877504017) failed on this advisory alone.
# Removal conditions: drop this ignore when the locked
# libsqlite3-sys reaches >=0.39.0 (the first release line bundling
# SQLite >=3.54.0) through a sqlx upgrade; and if the sqlx SQLite
# backend or any SQLite dependency is ever enabled, remove the
# ignore and re-assess the exposure.
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
