# Deterministic security tools — spec v2 §6 / operations require
# cargo audit + cargo deny in CI; §22.5 requires the fuzz targets to
# run for a bounded time in CI.
#
# Added 2026-10-17 (deterministic-tools pass). This file has NOT been
# exercised on GitHub yet: the repository is not pushed (the push needs
# the owner's GitHub sign-in). Treat the first real run as a shakedown.
#
# The marketplace builds need the Nettle backend for sequoia-openpgp
# (deploy/check-crypto-backend.sh guards it). On a stock GitHub runner
# nettle-dev provides the headers/pkg-config the sandbox VM lacks, so
# the NETTLE_PREGENERATED_BINDINGS shim used locally is unnecessary —
# but if the runner's nettle version differs from production, pin it
# before trusting a green run as a production signal.

name: security-tools

on:
  push:
  pull_request:
  schedule:
    # Weekly, so new advisories against the locked tree surface even
    # when nothing in the repo changed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  audit-deny-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nettle-dev clang pkg-config postgresql-client
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-audit and cargo-deny (prebuilt)
        run: |
          curl -sL https://github.com/RustSec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz | tar xz -C /tmp
          sudo install -m755 /tmp/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit /usr/local/bin/cargo-audit
          curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          sudo install -m755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - name: cargo audit (marketplace; ignore list in .cargo/audit.toml)
        run: cargo audit
      - name: cargo audit + deny (seller-helper, if it is in the repo)
        # seller-helper is a standalone crate that lives NEXT TO this
        # workspace in the working tree (monero-marketplace-v2/). If the
        # pushed repo does not include it at ../seller-helper, these
        # steps skip instead of failing.
        run: |
          if [ -f ../seller-helper/Cargo.toml ]; then
            (cd ../seller-helper && cargo audit && cargo deny check)
          else
            echo "seller-helper not present in this checkout; skipping"
          fi
      - name: cargo deny (marketplace)
        run: cargo deny check
      - name: Crypto backend guard (Q8)
        run: deploy/check-crypto-backend.sh
      - name: Clippy (warnings are reported, not yet denied)
        # The remaining warning backlog (type complexity, large Err
        # variants, never-read DTO fields — see the 2026-10-17 report)
        # is triaged but not zero, so this step does not use
        # -D warnings yet. Promote it once the backlog is burned down.
        run: cargo clippy --workspace --all-targets

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nettle-dev clang pkg-config
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly
          curl -sL https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          sudo install -m755 /tmp/cargo-fuzz /usr/local/bin/cargo-fuzz
      - name: Bounded fuzz smoke (60s per target)
        working-directory: fuzz
        run: |
          for t in envelope_validate envelope_keyref statements markup terms_file image_worker; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60
          done
